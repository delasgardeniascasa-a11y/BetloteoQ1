name: Actualizar ranking

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos
  workflow_dispatch:          # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-ranking
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar la API de Riot
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python update_ranks.py --no-html

      - name: Guardar cambios
        run: |
          if git diff --quiet players.json; then
            echo "Sin cambios"
          else
            git config user.name "soloq-bot"
            git config user.email "soloq-bot@users.noreply.github.com"
            git add players.json
            git commit -m "Actualizar ranking"
            git push
          fi
